[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirección principal para /juego y /juego/
[[redirects]]
  from = "/juego"
  to = "/Game/keepYourSheep/build/index.html"
  status = 200

[[redirects]]
  from = "/juego/"
  to = "/Game/keepYourSheep/build/index.html"
  status = 200

# Redirección de assets del juego -- NO uses force aquí, ni termines con index.html
[[redirects]]
  from = "/juego/assets/*"
  to = "/Game/keepYourSheep/build/assets/:splat"
  status = 200

[[redirects]]
  from = "/juego/dist/*"
  to = "/Game/keepYourSheep/build/dist/:splat"
  status = 200

[[redirects]]
  from = "/juego/css/*"
  to = "/Game/keepYourSheep/build/css/:splat"
  status = 200